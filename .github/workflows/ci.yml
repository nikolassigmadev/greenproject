name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Lint
        run: npx eslint .

      - name: Unit tests
        run: npx vitest run

      # Offline mode only. The homepage check is deterministic and is the one
      # that must never regress — citing an organisation's front page next to a
      # specific allegation is a failure this repo already shipped once.
      # Liveness depends on other people's servers and would flake the build for
      # reasons that aren't ours; run the full audit by hand before publishing:
      #   npx tsx scripts/verify-sources.ts --csv docs/source-audit.csv
      - name: Source citations point at documents, not homepages
        run: npx tsx scripts/verify-sources.ts --offline

      - name: Build
        run: npx vite build
